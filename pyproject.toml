[project]
name = "librarybot"
version = "1.0.0"
requires-python = ">=3.11"
description = "Personal Telegram reading forest with PostgreSQL storage"
dependencies = [
  "python-telegram-bot[job-queue]==21.11.1",
  "psycopg[binary,pool]==3.2.10",
  "python-dotenv==1.1.1",
  "tzdata==2025.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.13.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
