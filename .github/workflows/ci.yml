name: Verify LibraryBot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: librarybot
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: librarybot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U librarybot -d librarybot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://librarybot:ci_password@127.0.0.1:5432/librarybot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: ruff check bot tests main.py app.py
      - run: pytest -q
      - run: docker build -t librarybot:ci .
